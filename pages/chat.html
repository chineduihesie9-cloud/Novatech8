<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages · NovaTech</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../chat.css"><style>.support-shell{max-width:1100px;margin:45px auto;padding:0 18px}.support-card{background:#fff;border:1px solid #e5eaf2;border-radius:24px;box-shadow:0 20px 60px #132b5014;overflow:hidden}.support-top{padding:22px 26px;border-bottom:1px solid #edf1f6;display:flex;align-items:center;gap:14px}.support-avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#132b50,#3567b5);color:white;font-weight:800}.support-top small{display:block;color:#8491a5;margin-top:4px}.support-main{height:580px;display:flex;flex-direction:column}.support-chat-messages{flex:1;overflow:auto;padding:28px;background:#f6f8fc}.support-bubble{max-width:75%;padding:12px 15px;border-radius:17px;margin:10px 0;box-shadow:0 4px 12px #132b500a}.support-bubble.mine{margin-left:auto;background:#132b50;color:#fff;border-bottom-right-radius:5px}.support-bubble.theirs{background:#fff;color:#25334a;border-bottom-left-radius:5px}.support-bubble .bubble-meta{font-size:10px;opacity:.65;margin-bottom:6px}.support-bubble p{margin:0;white-space:pre-wrap;line-height:1.5}.support-bubble img,.support-bubble video{display:block;max-width:280px;max-height:260px;border-radius:12px;margin-top:8px}.support-compose{display:flex;gap:10px;padding:18px;border-top:1px solid #edf1f6}.support-compose input[type=text]{flex:1;min-width:0;border:1px solid #dbe3ee;border-radius:999px;padding:13px 17px}.support-compose button{border:0;border-radius:999px;background:#132b50;color:#fff;padding:0 22px;font-weight:800}.support-plus{width:44px!important;padding:0!important;font-size:25px}.support-preview{padding:8px 18px;color:#52627a;font-size:13px}.support-preview button{background:none;color:#b42318;padding:0 8px}.support-empty{text-align:center;color:#8491a5;padding:35px}.support-status{padding:0 20px 10px;color:#b42318;font-size:12px}.support-preview{display:flex;align-items:center}
.preview-thumb-row{display:flex;align-items:center;gap:10px;width:100%}
.preview-thumb-row img,.preview-thumb-row video{width:52px;height:52px;object-fit:cover;border-radius:10px;flex-shrink:0}
.preview-filename{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#52627a}
