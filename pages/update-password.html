<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password | NovaTech</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-brand">
                <a href="../index.html">NovaTech</a>
                <p>Secure account recovery</p>
            </div>
            <div class="auth-card">
                <h1>Update Password</h1>
                <p class="auth-subtitle">Choose a new password for your account.</p>
                <form id="updatePasswordForm">
                    <div id="authMessage" role="status" aria-live="polite"></div>
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input id="newPassword" name="password" type="password" minlength="6" autocomplete="new-password" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmNewPassword">Confirm Password</label>
                        <input id="confirmNewPassword" name="confirmPassword" type="password" minlength="6" autocomplete="new-password" required>
                    </div>
                    <button type="submit" class="auth-submit">Update Password</button>
                </form>
                <p class="auth-switch"><a href="../login.html">Return to login</a></p>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../script.js"></script>
</body>
</html>
